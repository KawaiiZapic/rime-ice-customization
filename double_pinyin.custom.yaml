patch:
  # 原样显示输入，而不将其转换为对应的拼音，输入pnyn将显示为pnyn而不是pinyin
  "translator/preedit_format": []
  "schema/name": 中文（简体）
  # 禁止自动补全长句
  "translator/enable_word_completion": false
  "cn_en/enable_completion": false
  # 自动造词/自动调频
  "translator/enable_user_dict": true
  "translator/enable_encoder": true
  "translator/max_phrase_length": 4  
  "translator/enable_sentence": false
  date_translator:
    date: /riqi
    time: /uijm
    week: /xyqi
    datetime: /riqiuijm
    timestamp: /uijmio
    datezh: /uijmvs
    dateen: /uijmyy
  uuid: /uuid
  lunar: /nsli
  pin_cand_filter:
    # 格式：编码<Tab>字词1<Space>字词2……
    - d	的
    - l	了
    - m	吗
  "speller/alphabet": /zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA`
  "speller/initials": /zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
